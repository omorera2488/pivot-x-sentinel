<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pivot-x-sentinel · Configuración</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="narrower">

<div class="toolbar">
  <a class="nav" href="index.html">← Volver al panel</a>
  <strong id="botState" class="muted">Consultando estado…</strong>
</div>

<h1>Configuración del bot</h1>
<div class="sub">Guardar cambios detiene el bot si está corriendo. Para volver a operar iniciálo de nuevo desde el panel principal.</div>

<div class="err-banner" id="err"></div>

<section class="card" style="margin-top:20px;">
<form id="cfgForm">
  <div class="config-grid">
    <label class="setting">
      <b>Estrategia (perfil)</b>
      <small>Los dos perfiles del Pine de origen (<code>/basecode_tradingview</code>): 1m (EMA 15, bloque HTF 100min) y 5m (EMA 12, bloque HTF 400min). Elegir uno precarga sus defaults — todos son editables después.</small>
      <select id="profile">
        <option value="5m">5m — EMA 12, bloque 400min</option>
        <option value="1m">1m — EMA 15, bloque 100min</option>
      </select>
    </label>
    <label class="setting">
      <b>Instrumento</b>
      <small>Base del instrumento (XAUUSD, BTCUSD…) — el bot resuelve solo el nombre exacto de tu bróker (XAUUSDm, XAUUSDc, XAUUSD.a…), no hace falta saberlo. Si tu bróker lista más de un símbolo que matchee, poné el nombre exacto acá.</small>
      <input type="text" id="symbol" value="XAUUSD">
    </label>

    <label class="setting">
      <b>Volumen por operación (lotes)</b>
      <small>Lote fijo — el dimensionamiento por riesgo variable es tema de la Fase 8, no de este bot todavía.</small>
      <input type="number" id="fixed_lot" step="0.01" min="0.01">
    </label>
    <label class="setting">
      <b>Riesgo : Beneficio</b>
      <small>Múltiplo del riesgo para el take profit. Sin validar por backtest todavía (docs/spec-backtest.md §8).</small>
      <input type="number" id="rr" step="0.1" min="0.1">
    </label>

    <label class="setting">
      <b>Período de la EMA</b>
      <small>Cantidad de velas usadas para la media exponencial que cruza las señales.</small>
      <input type="number" id="ema_periods" min="1" step="1">
    </label>
    <label class="setting">
      <b>Bloque HTF (minutos)</b>
      <small>Duración del bloque de referencia — el bloque que se está formando (paridad con TradingView, spec-estrategia.md §3.3).</small>
      <input type="number" id="periodos_htf_min" min="1" step="1">
    </label>

    <label class="setting">
      <b>Buffer del stop (basis points)</b>
      <small>Margen más allá del nivel de resistencia/soporte para el stop.</small>
      <input type="number" id="buf_bp" step="0.1" min="0">
    </label>
    <label class="setting">
      <b><input type="checkbox" id="una_operacion_a_la_vez"> Una operación a la vez</b>
      <small>Activado por defecto: mientras haya una operación pendiente o abierta (venta o compra), bloquea cualquier señal nueva, aunque se cumpla la estrategia. Desmarcá esto para permitir varias a la vez, limitadas por "Máx. operaciones concurrentes por dirección" (spec-estrategia.md §6).</small>
    </label>
    <label class="setting">
      <b>Máx. operaciones concurrentes por dirección</b>
      <small id="maxConcurrentHint">Límite propio de este motor — el Pine original no tenía ninguno (spec-estrategia.md §6). Ignorado mientras "Una operación a la vez" esté activado.</small>
      <input type="number" id="max_concurrent_por_direccion" min="1" step="1">
    </label>

    <label class="setting">
      <b>Máximo de barras por operación</b>
      <small>Tope de espera de una orden pendiente y de duración de una posición abierta.</small>
      <input type="number" id="max_bars_trade" min="10" step="1">
    </label>
    <label class="setting">
      <b>Barras de validez (modo fijo)</b>
      <small>Solo aplica si "Orden viva" está desactivado.</small>
      <input type="number" id="valid_bars" min="1" step="1">
    </label>

    <label class="setting">
      <b><input type="checkbox" id="orden_viva"> Orden viva hasta invalidarse</b>
      <small>Default del Pine: activado. La orden pendiente vive hasta que el precio invalida el setup o se cumple el máximo de barras.</small>
    </label>
    <label class="setting">
      <b><input type="checkbox" id="entrada_viva"> Entrada en la EMA actual (móvil)</b>
      <small>Variante del Pine (spec-estrategia.md §4.3): el llenado sigue la EMA en vivo. Default: desactivado.</small>
    </label>

    <label class="setting">
      <b>Magic number</b>
      <small>Identifica las órdenes de este bot en MT5 — nunca toca posiciones manuales con otro magic number.</small>
      <input type="number" id="magic" min="1" step="1">
    </label>
    <label class="setting">
      <b>Intervalo de sondeo (segundos)</b>
      <small>Cada cuánto el bot revisa si cerró una vela nueva.</small>
      <input type="number" id="poll_interval_s" min="1" step="1">
    </label>
  </div>

  <div class="config-grid" style="margin-bottom:16px;">
    <label class="setting">
      <b><input type="checkbox" id="live"> Operar en vivo (manda órdenes reales)</b>
      <small>Activado por defecto: el bot opera de una contra la cuenta que tengas conectada en MT5, sea demo o real -- esa elección es tuya, se hace al loguear la cuenta en la terminal, no acá. Desmarcá esto si por ahora solo querés que calcule señales y loguee qué haría, sin mandar ninguna orden (útil para validar un cambio de configuración). Operar conlleva riesgo de pérdida real de capital.</small>
    </label>
  </div>

  <div class="toolbar" style="margin-top:18px;">
    <button type="submit" class="start">Guardar cambios y detener bot</button>
    <span id="savedNote" class="muted"></span>
  </div>
</form>
</section>

</main>
<script src="app.js?v=3"></script>
<script>
const FIELDS = ["symbol", "magic", "poll_interval_s", "live", "ema_periods", "periodos_htf_min",
  "buf_bp", "rr", "max_concurrent_por_direccion", "valid_bars", "orden_viva", "max_bars_trade",
  "fixed_lot", "entrada_viva", "una_operacion_a_la_vez"];

function getEl(id) { return document.getElementById(id); }

function syncConcurrencyToggle() {
  const unaSola = getEl("una_operacion_a_la_vez").checked;
  getEl("max_concurrent_por_direccion").disabled = unaSola;
}

function readForm() {
  const cfg = { profile: getEl("profile").value };
  for (const f of FIELDS) {
    const el = getEl(f);
    cfg[f] = el.type === "checkbox" ? el.checked : (el.type === "number" ? Number(el.value) : el.value);
  }
  return cfg;
}

function fillForm(cfg) {
  getEl("profile").value = cfg.profile || "5m";
  for (const f of FIELDS) {
    const el = getEl(f);
    if (cfg[f] === undefined || cfg[f] === null) continue;
    if (el.type === "checkbox") el.checked = !!cfg[f];
    else el.value = cfg[f];
  }
  syncConcurrencyToggle();
}

let profileDefaults = {};

async function applyProfileDefaults(name, keepUserValues) {
  const defaults = profileDefaults[name];
  if (!defaults) return;
  const cfg = keepUserValues ? readForm() : {};
  fillForm({ ...defaults, ...(keepUserValues ? { symbol: cfg.symbol, magic: cfg.magic, poll_interval_s: cfg.poll_interval_s, live: cfg.live } : {}), profile: name });
}

async function init() {
  try {
    profileDefaults = await apiGet("/profiles");
  } catch (err) {
    showError("err", err);
  }

  // Los defaults van COMO BASE, no como fallback exclusivo del caso "sin
  // config guardada": si alguien tiene un pending viejo en localStorage de
  // antes de que existiera un campo nuevo (ej. una_operacion_a_la_vez), ese
  // campo faltante tiene que caer en su default (true), no quedar "sin
  // marcar" porque el checkbox del HTML arranca asi -- eso guardaria false
  // de verdad si el usuario aprieta Guardar sin darse cuenta.
  const defaults = { profile: "5m", symbol: "XAUUSD", magic: 900001, poll_interval_s: 10,
                      live: true, una_operacion_a_la_vez: true, ...profileDefaults["5m"] };
  const pending = loadPendingConfig();
  fillForm(pending ? { ...defaults, ...pending } : defaults);

  try {
    const s = await apiGet("/status");
    const badge = getEl("botState");
    if (s.running) {
      badge.textContent = "● Bot activo";
      badge.className = "ok";
    } else {
      badge.textContent = "● Bot detenido";
      badge.className = "bad";
    }
  } catch (err) {
    showError("err", err);
  }
}

getEl("profile").addEventListener("change", (e) => applyProfileDefaults(e.target.value, true));
getEl("una_operacion_a_la_vez").addEventListener("change", syncConcurrencyToggle);

getEl("cfgForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const cfg = readForm();
  savePendingConfig(cfg);
  try {
    const s = await apiGet("/status");
    if (s.running) await apiPost("/stop");
    getEl("savedNote").textContent = "Guardado. El bot quedó detenido -- iniciálo de nuevo desde el panel principal para aplicar los cambios.";
  } catch (err) {
    showError("err", err);
  }
});

init();
</script>
</body>
</html>
