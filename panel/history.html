<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pivot-x-sentinel · Historial</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="narrow">

<div class="toolbar">
  <a class="nav" href="index.html">← Panel</a>
  <a class="nav" href="calendar.html">Calendario</a>
  <button class="export" id="btnExport" disabled>Exportar historial CSV</button>
</div>

<h1>Historial completo</h1>
<div class="sub" id="scope">Operaciones cerradas por el bot, leídas directo del historial de MT5 (<code>GET /history</code>).</div>

<div class="err-banner" id="err"></div>

<section class="card">
  <div class="summary" id="summary"></div>
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr><th>Fecha y hora local</th><th>Posición</th><th>Tipo</th><th>Volumen</th><th>Precio de salida</th><th>Resultado neto</th></tr>
      </thead>
      <tbody id="body"><tr><td colspan="6" class="loading">Cargando…</td></tr></tbody>
    </table>
  </div>
</section>

</main>
<script src="app.js?v=3"></script>
<script>
let allTrades = [];

async function load() {
  try {
    const s = await apiGet("/status");
    const qs = s.symbol ? `?symbol=${s.symbol}&magic=${s.magic}&days=3650` : "?days=3650";
    const history = await apiGet("/history" + qs);
    allTrades = closedTrades(history).reverse();
    render();
  } catch (err) {
    showError("err", err);
    document.getElementById("body").innerHTML = `<tr><td colspan="6" class="muted">No se pudo cargar.</td></tr>`;
  }
}

function render() {
  const { n, wins, losses, total, winRate } = tradeStats(allTrades);
  document.getElementById("btnExport").disabled = !n;
  document.getElementById("scope").textContent = `Historial conservado · ${n} operaciones cerradas.`;
  document.getElementById("summary").innerHTML =
    `<span>Total histórico<br><b class="${total >= 0 ? "ok" : "bad"}">${fmtUSD(total)}</b></span>` +
    `<span>Ganadas<br><b>${wins}</b></span>` +
    `<span>Perdidas<br><b>${losses}</b></span>` +
    `<span>Efectividad<br><b>${winRate === null ? "--" : fmtPct(winRate)}</b></span>`;

  const tbody = document.getElementById("body");
  if (!allTrades.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="muted">Sin operaciones cerradas todavía.</td></tr>`;
    return;
  }
  tbody.innerHTML = allTrades.map((t) => `
    <tr>
      <td>${fmtLocalDateTime(t.time)}</td>
      <td>${t.position_id}</td>
      <td class="${t.side === "compra" ? "ok" : "bad"}">${sideLabel(t.side)}</td>
      <td>${t.volume}</td>
      <td>${t.price}</td>
      <td class="${t.net > 0 ? "ok" : t.net < 0 ? "bad" : ""}">${fmtUSD(t.net)}</td>
    </tr>`).join("");
}

document.getElementById("btnExport").addEventListener("click", () => {
  const header = "fecha_local,posicion,tipo,volumen,precio,resultado_neto\n";
  const rows = allTrades.map((t) =>
    [fmtLocalDateTime(t.time), t.position_id, sideLabel(t.side), t.volume, t.price, t.net.toFixed(2)].join(",")
  ).join("\n");
  const blob = new Blob(["﻿" + header + rows], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `pivot-x-sentinel-historial-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

load();
</script>
</body>
</html>
