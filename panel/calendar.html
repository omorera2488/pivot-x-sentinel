<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pivot-x-sentinel · Calendario</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="narrow">

<div class="toolbar">
  <a class="nav" href="index.html">← Panel</a>
  <a class="nav" href="history.html">Historial completo</a>
</div>

<h1>Resultados por día operativo</h1>
<div class="sub" id="scope">Calculado con el historial de operaciones cerradas de MT5 (<code>GET /history</code>), agrupado por día local.</div>

<div class="err-banner" id="err"></div>

<div class="toolbar">
  <button class="nav" id="btnPrev">‹ Anterior</button>
  <strong id="monthLabel" style="flex:1; text-align:center;">--</strong>
  <button class="nav" id="btnNext">Siguiente ›</button>
</div>

<div class="totals">
  <div class="total-card"><span>Resultado del mes</span><b id="monthResult">$0.00</b></div>
  <div class="total-card"><span>Operaciones del mes</span><b id="monthOps">0</b></div>
  <div class="total-card"><span>Total histórico</span><b id="totalResult">$0.00</b></div>
  <div class="total-card"><span>Operaciones históricas</span><b id="totalOps">0</b></div>
</div>

<div class="calendar" id="calGrid"></div>

</main>
<script src="app.js"></script>
<script>
const DAY_NAMES = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];
let allTrades = [];
let cursor = new Date();
cursor.setDate(1);

async function load() {
  try {
    const s = await apiGet("/status");
    const qs = s.symbol ? `?symbol=${s.symbol}&magic=${s.magic}&days=3650` : "?days=3650";
    const history = await apiGet("/history" + qs);
    allTrades = closedTrades(history);
    const totals = tradeStats(allTrades);
    document.getElementById("totalResult").textContent = fmtUSD(totals.total);
    document.getElementById("totalResult").className = totals.total >= 0 ? "ok" : "bad";
    document.getElementById("totalOps").textContent = totals.n;
    render();
  } catch (err) {
    showError("err", err);
  }
}

function render() {
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  document.getElementById("monthLabel").textContent =
    cursor.toLocaleDateString("es-AR", { month: "long", year: "numeric" });

  const byDay = {};
  for (const t of allTrades) {
    const d = new Date(t.time * 1000);
    if (d.getFullYear() !== year || d.getMonth() !== month) continue;
    const key = d.getDate();
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(t);
  }

  let monthTotal = 0, monthOps = 0;
  for (const key in byDay) {
    monthOps += byDay[key].length;
    monthTotal += byDay[key].reduce((s, t) => s + t.net, 0);
  }
  document.getElementById("monthResult").textContent = fmtUSD(monthTotal);
  document.getElementById("monthResult").className = monthTotal >= 0 ? "ok" : "bad";
  document.getElementById("monthOps").textContent = monthOps;

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // lunes=0
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const grid = document.getElementById("calGrid");
  let html = DAY_NAMES.map((n) => `<div class="weekday">${n}</div>`).join("");
  for (let i = 0; i < startOffset; i++) html += `<div class="day empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const trades = byDay[day] || [];
    if (!trades.length) {
      html += `<div class="day"><div class="number">${day}</div><div class="muted" style="margin-top:15px;">Sin operaciones</div></div>`;
      continue;
    }
    const stats = tradeStats(trades);
    const cls = stats.total >= 0 ? "ok" : "bad";
    html += `<div class="day">
      <div class="number">${day}</div>
      <div class="result ${cls}">${fmtUSD(stats.total)}</div>
      <div class="muted">${stats.n} ops · ${stats.wins}G / ${stats.losses}P</div>
    </div>`;
  }
  grid.innerHTML = html;
}

document.getElementById("btnPrev").addEventListener("click", () => {
  cursor.setMonth(cursor.getMonth() - 1);
  render();
});
document.getElementById("btnNext").addEventListener("click", () => {
  cursor.setMonth(cursor.getMonth() + 1);
  render();
});

load();
</script>
</body>
</html>
